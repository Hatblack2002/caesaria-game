name: android-build

# CaesarIA Android (ARM64) build.
# Produces a signed APK with the bundled resources cache and uploads it as an
# artifact. Telemetry credentials are injected from repository secrets at
# build time and never committed to the repository.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout (full history for version numbering)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.9/bin/gradle --version

      - name: Inject telemetry config and build info (from secrets)
        env:
          TELEMETRY_TOKEN: ${{ secrets.TELEMETRY_TOKEN }}
          TELEMETRY_REPO: ${{ secrets.TELEMETRY_REPO }}
        run: |
          mkdir -p android/app/src/main/assets
          {
            echo "telemetry.token=${TELEMETRY_TOKEN}"
            echo "telemetry.repo=${TELEMETRY_REPO}"
          } > android/app/src/main/assets/telemetry.properties
          echo "${GITHUB_SHA}" > android/app/src/main/assets/build-commit.txt
          if [ -z "${TELEMETRY_REPO}" ]; then
            echo "WARNING: TELEMETRY_REPO secret not set; telemetry stays offline"
          fi

      - name: Build signed APK (arm64-v8a)
        run: |
          cd android
          gradle --no-daemon --stacktrace assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p apk
          find android/app/build/outputs -name "*.apk" -exec cp {} apk/ \;
          ls -la apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: caesaria-apk
          path: apk/
          if-no-files-found: error

      - name: Upload native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            android/app/.cxx/
          if-no-files-found: ignore
