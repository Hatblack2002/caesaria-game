name: android-build

# Builds the signed Android APK (arm64-v8a) for every push to master
# and publishes it as a workflow artifact + rolling release.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Build (assembleRelease)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Inspect APK
        run: |
          ls -la android/app/build/outputs/apk/release/
          ${ANDROID_HOME}/build-tools/34.0.0/aapt dump badging android/app/build/outputs/apk/release/app-release.apk | head -8

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: caesaria-android-arm64
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: CaesarIA Android (latest build)
          body: |
            APK automático (arm64-v8a, master).
            Instalación: descargar caesaria-arm64.apk e instalar permitiendo "fuentes desconocidas".
          files: android/app/build/outputs/apk/release/*.apk
          overwrite_files: true
          fail_on_unmatched_files: true
